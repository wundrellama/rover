<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0a08">
  <title>Rover · Vehicle Log</title>
  <style>
    @font-face {
      font-family: "Berkeley Mono";
      src: url("/apps/rover/assets/fonts/BerkeleyMono-Regular.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Berkeley Mono";
      src: url("/apps/rover/assets/fonts/BerkeleyMono-Bold.woff2") format("woff2");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Berkeley Mono";
      src: url("/apps/rover/assets/fonts/BerkeleyMono-Oblique.woff2") format("woff2");
      font-style: oblique;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Berkeley Mono";
      src: url("/apps/rover/assets/fonts/BerkeleyMono-Bold-Oblique.woff2") format("woff2");
      font-style: oblique;
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --rv-bg: #0b0a08;
      --rv-bg-raised: #141210;
      --rv-amber: #d8b843;
      --rv-amber-bright: #f2d97a;
      --rv-amber-dim: #9c8922;
      --rv-olive: #4e451f;
      --rv-warn: #e07b2c;
      --rv-ok: #b8b95e;
      color-scheme: dark;
      font-family: "Berkeley Mono", "DejaVu Sans Mono", ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      background: var(--rv-bg);
      color: var(--rv-amber);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background: var(--rv-bg);
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      line-height: 1.45;
    }

    button,
    input,
    select,
    textarea {
      min-height: 44px;
      border: 1px solid var(--rv-olive);
      border-radius: 0;
      background: var(--rv-bg);
      color: var(--rv-amber-bright);
      font: inherit;
    }

    button {
      padding: 0.65rem 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      border-color: var(--rv-amber-bright);
      outline: 2px solid var(--rv-amber-dim);
      outline-offset: 2px;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      min-height: 3.5rem;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--rv-olive);
      background: var(--rv-bg-raised);
    }

    .designation {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: var(--rv-amber-bright);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .wide-designation {
      display: none;
    }

    main {
      width: min(100%, 72rem);
      margin: 0 auto;
      padding: 1rem 0.75rem 5rem;
    }

    #status {
      margin: 0 0 1rem;
      color: var(--rv-amber-dim);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .view-header {
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--rv-olive);
    }

    h1,
    h2,
    h3,
    p {
      overflow-wrap: anywhere;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      color: var(--rv-amber-bright);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 0.75rem;
      font-size: clamp(1.5rem, 8vw, 2.5rem);
    }

    h2 {
      font-size: 1.15rem;
      text-transform: none;
    }

    h3 {
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    .eyebrow,
    .key,
    dt {
      color: var(--rv-amber-dim);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .vehicle-card {
      position: relative;
      margin: 0 0 1.25rem;
      padding: 1rem;
      border-left: 1px solid var(--rv-olive);
      border-right: 1px solid var(--rv-olive);
      background: var(--rv-bg-raised);
    }

    .vehicle-card::before,
    .vehicle-card::after {
      position: absolute;
      color: var(--rv-amber-dim);
      font-size: 1.1rem;
      line-height: 1;
    }

    .vehicle-card::before {
      top: -0.15rem;
      left: -0.2rem;
      content: "⌜";
    }

    .vehicle-card::after {
      right: -0.2rem;
      bottom: -0.15rem;
      content: "⌟";
    }

    .vehicle-card > header,
    .history-card > header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .vehicle-card .eyebrow {
      margin: 0 0 0.2rem;
    }

    .status {
      flex: 0 0 auto;
      color: var(--rv-ok);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }

    .odometer {
      display: grid;
      gap: 0.2rem;
      margin: 1rem 0;
      padding: 0.8rem 0;
      border-block: 1px solid var(--rv-olive);
    }

    .odometer strong {
      color: var(--rv-amber-bright);
      font-size: 1.35rem;
      font-weight: 700;
    }

    .definitions ul {
      margin: 0.5rem 0 1rem;
      padding-left: 1.25rem;
    }

    .history-card {
      margin: 0 0 0.75rem;
      padding: 0.8rem;
      border: 1px solid var(--rv-olive);
      background: var(--rv-bg);
    }

    .history-card header {
      margin-bottom: 0.75rem;
      color: var(--rv-amber-dim);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }

    .history-card time {
      text-align: right;
    }

    dl,
    dd {
      margin: 0;
    }

    .history-card dl {
      display: grid;
      gap: 0.65rem;
    }

    .history-card dl > div {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      min-width: 0;
    }

    dd {
      color: var(--rv-amber-bright);
      text-align: right;
      overflow-wrap: anywhere;
    }

    .derived {
      padding-top: 0.55rem;
      border-top: 1px solid var(--rv-olive);
    }

    .derived dd {
      color: var(--rv-ok);
      font-weight: 700;
    }

    .empty {
      color: var(--rv-warn);
    }

    .app-screen[hidden] {
      display: none;
    }

    .hub-header {
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--rv-olive);
    }

    .hub-primary,
    .hub-readouts article {
      position: relative;
      padding: 1rem;
      border: 1px solid var(--rv-olive);
      background: var(--rv-bg-raised);
    }

    .hub-primary {
      margin-bottom: 1rem;
      border-color: var(--rv-amber);
    }

    .hub-primary p {
      margin: 0;
    }

    .hub-actions,
    .hub-readouts {
      display: grid;
      gap: 0.75rem;
    }

    #vehicle-add-form,
    .vehicle-actions,
    .vehicle-entry-actions {
      display: grid;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .vehicle-settings {
      margin-bottom: 1rem;
      padding: 0.75rem;
      border: 1px solid var(--rv-olive);
    }

    .vehicle-settings summary {
      min-height: 44px;
      cursor: pointer;
      color: var(--rv-amber-bright);
      text-transform: uppercase;
    }

    .history-table-head,
    .history-record-toggle {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.5rem;
      width: 100%;
      text-align: left;
    }

    .history-table-head {
      margin-top: 1rem;
      padding: 0.5rem;
      color: var(--rv-amber-dim);
      font-size: 0.68rem;
    }

    .history-table-row {
      border: 1px solid var(--rv-olive);
    }

    .history-record-detail {
      padding: 0.8rem;
      border-top: 1px dashed var(--rv-olive);
    }

    .history-record-detail[hidden] {
      display: none;
    }

    .history-edit-form {
      display: grid;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .stat-table {
      margin-bottom: 1rem;
      padding: 0.75rem;
      border: 1px solid var(--rv-olive);
      overflow: hidden;
    }

    .stat-table h2 {
      margin-bottom: 0.75rem;
    }

    .stat-table table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 0.72rem;
    }

    .stat-table th,
    .stat-table td {
      padding: 0.45rem 0.25rem;
      border-top: 1px solid var(--rv-olive);
      overflow-wrap: anywhere;
      text-align: left;
      vertical-align: top;
    }

    .hub-actions {
      margin-bottom: 1rem;
    }

    .hub-readouts article {
      display: grid;
      gap: 0.35rem;
    }

    .hub-readouts span,
    .hub-readouts small {
      color: var(--rv-amber-dim);
    }

    .hub-readouts span {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }

    .hub-readouts strong {
      color: var(--rv-warn);
    }

    .back-control {
      width: auto;
      margin-bottom: 1rem;
      padding-inline: 0.75rem;
    }

    .action-bar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .entry-screen {
      margin-bottom: 1.25rem;
      padding: 1rem;
      border: 1px solid var(--rv-amber);
      background: var(--rv-bg-raised);
    }

    .entry-screen[hidden] {
      display: none;
    }

    .energy-source-control[hidden],
    .charge-energy-source-control[hidden],
    #fill-tags-picker[hidden],
    #fill-new-station[hidden] {
      display: none;
    }

    .entry-screen header {
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--rv-olive);
    }

    .entry-screen form,
    .entry-screen label {
      display: grid;
      gap: 0.35rem;
    }

    .entry-screen form {
      gap: 0.9rem;
    }

    .entry-screen label {
      color: var(--rv-amber-dim);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .entry-screen input,
    .entry-screen select {
      width: 100%;
      padding: 0.65rem;
      letter-spacing: 0;
      text-transform: none;
    }

    .input-unit {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
    }

    .input-unit output {
      display: grid;
      min-width: 4.5rem;
      min-height: 44px;
      place-items: center;
      border: 1px solid var(--rv-olive);
      border-left: 0;
      color: var(--rv-amber);
    }

    .preview-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: baseline;
      gap: 0.35rem 1rem;
      padding: 0.75rem;
      border: 1px solid var(--rv-olive);
      color: var(--rv-amber-dim);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .preview-row output {
      color: var(--rv-amber-bright);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .preview-row small {
      grid-column: 1 / -1;
      color: var(--rv-amber-dim);
      letter-spacing: 0;
      text-transform: none;
    }

    .derived-preview output {
      color: var(--rv-ok);
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .form-verdict {
      min-height: 1.5rem;
      color: var(--rv-warn);
    }

    .station-field,
    #fill-additives,
    #fill-tags,
    #fill-custom-fields,
    .drive-balance {
      margin: 0;
      padding: 0.8rem;
      border: 1px solid var(--rv-olive);
    }

    .station-field legend,
    #fill-additives legend,
    #fill-tags legend,
    #fill-custom-fields legend,
    .drive-balance legend {
      padding: 0 0.35rem;
      color: var(--rv-amber-bright);
      letter-spacing: 0.08em;
    }

    #fill-new-station {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--rv-olive);
    }

    .check-grid {
      display: grid;
      gap: 0.5rem;
    }

    .check-option {
      display: flex;
      min-height: 44px;
      flex-direction: row;
      align-items: center;
      gap: 0.65rem;
      margin: 0;
      color: var(--rv-text);
      letter-spacing: 0;
      text-transform: none;
    }

    .check-option input {
      width: 1.2rem;
      min-height: 1.2rem;
      margin: 0;
      accent-color: var(--rv-amber);
    }

    .read-only-row,
    .drive-balance {
      display: grid;
      gap: 0.5rem;
    }

    .read-only-row {
      padding: 0.65rem 0;
      color: var(--rv-amber-dim);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .read-only-row output,
    .drive-balance output {
      color: var(--rv-amber-bright);
      letter-spacing: 0;
      text-transform: none;
    }

    .drive-balance input[data-state="unset"] {
      opacity: 0.35;
    }

    .balance-ends {
      display: flex;
      justify-content: space-between;
      color: var(--rv-amber-dim);
      font-size: 0.72rem;
      text-transform: uppercase;
    }

    #fill-tags-picker {
      margin-top: 0.75rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .chip {
      padding: 0.15rem 0.4rem;
      border: 1px solid var(--rv-olive);
      color: var(--rv-amber-bright);
      font-size: 0.72rem;
    }

    .status-strip {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.45rem 0.75rem;
      border-top: 1px solid var(--rv-olive);
      background: var(--rv-bg-raised);
      color: var(--rv-amber-dim);
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .glow body {
      text-shadow: 0 0 0.32rem rgba(216, 184, 67, 0.32);
    }

    @media (min-width: 48rem) {
      .wide-designation {
        display: inline;
      }

      main {
        padding-inline: 1.5rem;
      }

      .action-bar {
        grid-template-columns: repeat(3, 1fr);
      }

      .entry-screen form {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .entry-screen .preview-row,
      .entry-screen .form-actions,
      .entry-screen .form-verdict {
        grid-column: 1 / -1;
      }

      #vehicle-view {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }

      .view-header {
        grid-column: 1 / -1;
      }

      .vehicle-card {
        margin: 0;
      }

      .history-card dl {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <header class="terminal-header">
    <p class="designation">
      ROVER · VEHICLE LOG<span class="wide-designation"> · UA 571-C · UNIT 01</span>
    </p>
    <button id="glow-toggle" type="button" aria-pressed="false">Glow off</button>
  </header>
  <main>
    <p id="status">Loading vehicle log…</p>
    <div id="app" aria-live="polite"></div>
  </main>
  <footer class="status-strip">
    <span>~bel · Rover</span>
    <span id="refresh-time">Awaiting data</span>
  </footer>
  <script>
    const app = document.getElementById('app');
    const status = document.getElementById('status');
    const refreshTime = document.getElementById('refresh-time');
    const glowToggle = document.getElementById('glow-toggle');

    let glow = false;
    try {
      glow = localStorage.getItem('rover-glow') === 'on';
    } catch (_) {
      glow = false;
    }

    function showGlow() {
      document.documentElement.classList.toggle('glow', glow);
      glowToggle.setAttribute('aria-pressed', String(glow));
      glowToggle.textContent = glow ? 'Glow on' : 'Glow off';
    }

    glowToggle.addEventListener('click', () => {
      glow = !glow;
      showGlow();
      try {
        localStorage.setItem('rover-glow', glow ? 'on' : 'off');
      } catch (_) {
        // The toggle still works when storage is unavailable.
      }
    });
    showGlow();

    function parseScaled(text, places) {
      const cleaned = text.trim().replaceAll(',', '');
      const match = cleaned.match(/^([0-9]+)(?:\.([0-9]*))?$/);
      if (!match || (match[2] || '').length > places) return null;
      const fraction = (match[2] || '').padEnd(places, '0');
      return BigInt(match[1] + fraction);
    }

    function completedPrice(text, profile) {
      const cleaned = text.trim().replace(/^\$\s*/, '');
      if (profile === 'us-usd-gal') {
        const match = cleaned.match(/^([0-9]+)(?:\.([0-9]*))?$/);
        if (!match || (match[2] || '').length > 3) return null;
        const fraction = match[2] || '';
        if (fraction.length === 3) return BigInt(match[1] + fraction);
        const cents = BigInt(match[1] + fraction.padEnd(2, '0'));
        return cents * 10n + 9n;
      }
      return parseScaled(cleaned, 3);
    }

    function millsText(mills, currency, decimals) {
      const minorScale = 10n ** BigInt(decimals);
      const millsPerMinor = 1000n / minorScale;
      const minor = mills / millsPerMinor;
      const whole = minor / minorScale;
      const fraction = (minor % minorScale).toString().padStart(decimals, '0');
      const prefix = currency === 'usd' ? '$' : 'EUR ';
      return `${prefix}${whole}${decimals ? `.${fraction}` : ''}`;
    }

    function priceText(mills, profile) {
      const whole = mills / 1000n;
      const fraction = (mills % 1000n).toString().padStart(3, '0');
      return `${profile === 'us-usd-gal' ? '$' : 'EUR '}${whole}.${fraction}`;
    }

    function roundHalfUp(numerator, denominator) {
      return (numerator + denominator / 2n) / denominator;
    }

    function bindEntryScreens() {
      const screens = [...app.querySelectorAll('.app-screen')];
      const defaultVehicle =
        app.querySelector('#app-default-data')?.dataset.vehicle || '';
      app.querySelectorAll('[data-open-screen]').forEach((button) => {
        button.addEventListener('click', () => {
          screens.forEach((screen) => {
            screen.hidden = screen.id !== button.dataset.openScreen;
          });
          document.getElementById(button.dataset.openScreen)?.scrollIntoView();
        });
      });
      app.querySelectorAll('[data-close-screen]').forEach((button) => {
        button.addEventListener('click', () => {
          screens.forEach((screen) => {
            screen.hidden = screen.id !== 'main-hub';
          });
          document.getElementById('main-hub')?.scrollIntoView();
        });
      });
      app.querySelectorAll('[data-open-vehicle-settings]').forEach((button) => {
        button.addEventListener('click', () => {
          screens.forEach((screen) => {
            screen.hidden = screen.id !== 'vehicle-settings-screen';
          });
          app.querySelectorAll('[data-vehicle-settings-panel]').forEach((panel) => {
            panel.hidden = panel.dataset.vehicle !== button.dataset.vehicle;
          });
          document.getElementById('vehicle-settings-screen')?.scrollIntoView();
        });
      });

      const vehicleAddForm = app.querySelector('#vehicle-add-form');
      if (vehicleAddForm) {
        const energy = vehicleAddForm.elements.energy;
        const seen = new Set();
        [...energy.options].forEach((option) => {
          if (seen.has(option.value)) option.remove();
          else seen.add(option.value);
        });
        vehicleAddForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const verdict = vehicleAddForm.querySelector('output');
          verdict.value = 'Saving…';
          const response = await fetch('/apps/rover/add-vehicle', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify(Object.fromEntries(new FormData(vehicleAddForm)))
          });
          verdict.value = await response.text();
          if (response.ok) await loadView();
        });
      }

      app.querySelectorAll('[data-set-default-vehicle]').forEach((button) => {
        button.addEventListener('click', async () => {
          const response = await fetch('/apps/rover/set-default-vehicle', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({vehicle: button.dataset.vehicle})
          });
          if (response.ok) await loadView();
        });
      });

      app.querySelectorAll('[data-remove-vehicle]').forEach((button) => {
        button.addEventListener('click', async () => {
          if (!confirm(`Remove ${button.dataset.vehicle}?`)) return;
          const response = await fetch('/apps/rover/remove-vehicle', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({vehicle: button.dataset.vehicle})
          });
          if (response.ok) await loadView();
        });
      });
      app.querySelectorAll('.vehicle-settings-form').forEach((settingsForm) => {
        settingsForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const verdict = settingsForm.querySelector('output');
          verdict.value = 'Saving…';
          const response = await fetch('/apps/rover/edit-vehicle', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify(Object.fromEntries(new FormData(settingsForm)))
          });
          verdict.value = await response.text();
          if (response.ok) await loadView();
        });
      });

      app.querySelectorAll('[data-vehicle-action]').forEach((button) => {
        button.addEventListener('click', () => {
          const screenId = {
            fill: 'add-fill',
            charge: 'add-charge',
            odometer: 'add-odometer'
          }[button.dataset.vehicleAction];
          screens.forEach((screen) => {
            screen.hidden = screen.id !== screenId;
          });
          const target = app.querySelector(`#${screenId} [name="vehicle"]`);
          if (target) {
            target.value = button.dataset.vehicle;
            target.dispatchEvent(new Event('change', {bubbles: true}));
          }
          document.getElementById(screenId)?.scrollIntoView();
        });
      });

      const historyFilter = app.querySelector('#history-vehicle-filter');
      if (historyFilter) {
        if (defaultVehicle) historyFilter.value = defaultVehicle;
        const syncHistory = () => {
          let visible = 0;
          app.querySelectorAll('[data-history-vehicle]').forEach((row) => {
            row.hidden = row.dataset.historyVehicle !== historyFilter.value;
            if (!row.hidden) visible += 1;
          });
          app.querySelector('#history-empty').hidden = visible !== 0;
        };
        historyFilter.addEventListener('change', syncHistory);
        syncHistory();
      }

      app.querySelectorAll('.history-record-toggle').forEach((button) => {
        button.addEventListener('click', () => {
          const detail = button.nextElementSibling;
          detail.hidden = !detail.hidden;
          button.setAttribute('aria-expanded', String(!detail.hidden));
        });
      });

      app.querySelectorAll('.history-edit-form').forEach((editForm) => {
        editForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const verdict = editForm.querySelector('output');
          verdict.value = 'Saving…';
          const formData = new FormData(editForm);
          const payload = Object.fromEntries(formData);
          payload.additives = formData.getAll('additives');
          payload.tags = formData.getAll('tags');
          const response = await fetch('/apps/rover/edit-fill', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify(payload)
          });
          verdict.value = await response.text();
          if (response.ok) await loadView();
        });
      });

      const customDefinitionForm =
        app.querySelector('#custom-field-definition-form');
      if (customDefinitionForm) {
        customDefinitionForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const verdict = customDefinitionForm.querySelector('output');
          const payload = Object.fromEntries(new FormData(customDefinitionForm));
          payload.mandatory =
            customDefinitionForm.elements.mandatory.checked ? 'yes' : 'no';
          const response = await fetch('/apps/rover/add-custom-field', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify(payload)
          });
          verdict.value = await response.text();
          if (response.ok) await loadView();
        });
      }

      app.querySelectorAll('[data-archive-custom-field]').forEach((button) => {
        button.addEventListener('click', async () => {
          const response = await fetch('/apps/rover/archive-custom-field', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({label: button.dataset.label})
          });
          if (response.ok) await loadView();
        });
      });

      app.querySelectorAll('[data-change-custom-field]').forEach((button) => {
        button.addEventListener('click', async () => {
          const contentType =
            button.previousElementSibling.value;
          const response = await fetch('/apps/rover/change-custom-field-type', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({
              label: button.dataset.label,
              contentType,
              mandatory: 'no'
            })
          });
          if (response.ok) await loadView();
        });
      });

      const form = app.querySelector('#fill-form');
      if (!form) return;
      const vehicle = form.elements.vehicle;
      const definition = form.elements.definition;
      const profile = form.elements.profile;
      const quantity = form.elements.quantity;
      const price = form.elements.price;
      const settlement = form.elements.settlement;
      const unit = app.querySelector('#fill-unit');
      const completed = app.querySelector('#fill-price-completed');
      const total = app.querySelector('#fill-derived-total');
      const verdict = app.querySelector('#fill-verdict');
      const station = app.querySelector('#fill-station');
      const stationSearch = app.querySelector('#fill-station-search');
      const newStation = app.querySelector('#fill-new-station');
      const energySourceControl = form.querySelector('.energy-source-control');
      const subtype = form.elements.subtype;
      const drivingMode = form.elements.drivingMode;
      const partialFill = form.elements.partialFill;
      const driveBalance = form.elements.driveBalance;
      const driveBalanceState = app.querySelector('#fill-drive-balance-state');
      const tagsToggle = app.querySelector('#fill-tags-toggle');
      const tagsPicker = app.querySelector('#fill-tags-picker');
      if (defaultVehicle) vehicle.value = defaultVehicle;

      const syncDefinitions = () => {
        const options = [...definition.options];
        options.forEach((option) => {
          option.hidden = option.dataset.vehicle !== vehicle.value;
        });
        if (definition.selectedOptions[0]?.hidden) {
          definition.value = options.find((option) => !option.hidden)?.value || '';
        }
        const available = options.filter((option) => !option.hidden);
        const availableSources = new Set(available.map((option) => option.value));
        energySourceControl.hidden = availableSources.size <= 1;
        const selected = definition.selectedOptions[0];
        unit.textContent = selected?.dataset.unit || 'unit';
        if (selected?.dataset.unit === 'gal') profile.value = 'us-usd-gal';
        if (selected?.dataset.unit === 'litre') profile.value = 'eu-eur-litre';
        syncSubtypes();
        updatePreview();
      };

      const syncSubtypes = () => {
        const options = [...subtype.options];
        options.forEach((option) => {
          if (!option.dataset.definition) return;
          option.hidden = option.dataset.definition !== definition.value;
        });
        const selectedUnavailable =
          subtype.selectedOptions[0]?.dataset.definition &&
          subtype.selectedOptions[0]?.hidden;
        if (!subtype.value || selectedUnavailable) {
          const marker = app.querySelector(
            `[data-default-subtype-vehicle="${CSS.escape(vehicle.value)}"]`
          );
          const preferred = marker?.dataset.defaultSubtype;
          const preferredOption = options.find(
            (option) => !option.hidden && option.value === preferred
          );
          subtype.value =
            preferredOption?.value ||
            options.find((option) => option.dataset.definition && !option.hidden)?.value ||
            '';
        }
      };

      const syncDrivingModes = () => {
        const options = [...drivingMode.options];
        options.forEach((option) => {
          if (!option.dataset.vehicle) return;
          option.hidden = option.dataset.vehicle !== vehicle.value;
        });
        if (drivingMode.selectedOptions[0]?.hidden) drivingMode.value = '';
      };

      const updatePreview = () => {
        const quantityMilli = parseScaled(quantity.value, 3);
        const priceMills = completedPrice(price.value, profile.value);
        completed.value = priceMills === null ? '—' : priceText(priceMills, profile.value);
        if (quantityMilli === null || priceMills === null) {
          total.value = '—';
          return;
        }
        const product = quantityMilli * priceMills;
        const minor = roundHalfUp(product * 100n, 1000000n);
        let totalMills = minor * 10n;
        if (settlement.value === 'cash') {
          totalMills = roundHalfUp(totalMills, 50n) * 50n;
        }
        total.value = millsText(
          totalMills,
          profile.value === 'us-usd-gal' ? 'usd' : 'eur',
          2
        );
      };

      const now = new Date();
      const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
      form.elements.observed.value = local.toISOString().slice(0, 16);
      form.elements.zone.value = Intl.DateTimeFormat().resolvedOptions().timeZone;
      vehicle.addEventListener('change', () => {
        subtype.value = '';
        syncDefinitions();
        syncDrivingModes();
      });
      definition.addEventListener('change', syncDefinitions);
      [quantity, price, profile, settlement].forEach((field) => {
        field.addEventListener('input', updatePreview);
        field.addEventListener('change', updatePreview);
      });
      syncDefinitions();
      syncDrivingModes();
      partialFill.addEventListener('change', () => {
        form.elements.tank.value = partialFill.checked ? 'partial' : 'full';
      });
      driveBalance.addEventListener('input', () => {
        driveBalance.dataset.state = 'set';
        driveBalanceState.value =
          `${100 - Number(driveBalance.value)}% city / ${driveBalance.value}% highway`;
      });
      tagsToggle?.addEventListener('click', () => {
        tagsPicker.hidden = !tagsPicker.hidden;
        tagsToggle.setAttribute('aria-expanded', String(!tagsPicker.hidden));
      });
      station?.addEventListener('change', () => {
        newStation.hidden = station.value !== 'new';
      });
      stationSearch?.addEventListener('input', () => {
        const needle = stationSearch.value.trim().toLocaleLowerCase();
        [...station.options].forEach((option) => {
          if (option.value === 'none' || option.value === 'new') return;
          option.hidden =
            needle.length > 0 &&
            !option.dataset.search.toLocaleLowerCase().includes(needle);
        });
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        verdict.value = 'Saving…';
        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());
        payload.additives = formData.getAll('additives');
        payload.tags = formData.getAll('tags');
        payload.missedFill = form.elements.missedFill.checked ? 'yes' : 'no';
        payload.driveBalance =
          driveBalance.dataset.state === 'set' ? driveBalance.value : '';
        form.querySelectorAll('[data-custom-field]').forEach((field) => {
          payload[field.name] =
            field.dataset.customType === 'boolean'
              ? (field.checked ? 'yes' : '')
              : field.value;
        });
        try {
          const response = await fetch('/apps/rover/add-fill', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify(payload)
          });
          const message = await response.text();
          verdict.value = message;
          if (response.ok) await loadView();
        } catch (error) {
          verdict.value = `%unavailable: fill · ${error.message}`;
        }
      });

      const chargeForm = app.querySelector('#charge-form');
      if (chargeForm) {
        const chargeVehicle = chargeForm.elements.vehicle;
        const chargeDefinition = chargeForm.elements.definition;
        const chargeSubtype = chargeForm.elements.subtype;
        const chargeEnergySourceControl =
          chargeForm.querySelector('.charge-energy-source-control');
        if (defaultVehicle) chargeVehicle.value = defaultVehicle;
        const syncChargeDefinitions = () => {
          const options = [...chargeDefinition.options];
          options.forEach((option) => {
            option.hidden =
              option.dataset.vehicle !== chargeVehicle.value ||
              option.dataset.kind !== 'electricity';
          });
          const vehicleSources = new Set(options
            .filter((option) => option.dataset.vehicle === chargeVehicle.value)
            .map((option) => option.value));
          chargeEnergySourceControl.hidden = vehicleSources.size <= 1;
          if (chargeDefinition.selectedOptions[0]?.hidden) {
            chargeDefinition.value =
              options.find((option) => !option.hidden)?.value || '';
          }
          [...chargeSubtype.options].forEach((option) => {
            option.hidden = option.dataset.definition !== chargeDefinition.value;
          });
          if (chargeSubtype.selectedOptions[0]?.hidden) {
            chargeSubtype.value =
              [...chargeSubtype.options].find((option) => !option.hidden)?.value || '';
          }
        };
        chargeVehicle.addEventListener('change', syncChargeDefinitions);
        chargeDefinition.addEventListener('change', syncChargeDefinitions);
        syncChargeDefinitions();
        chargeForm.elements.start.value = local.toISOString().slice(0, 16);
        chargeForm.elements.end.value = local.toISOString().slice(0, 16);
        chargeForm.elements.zone.value =
          Intl.DateTimeFormat().resolvedOptions().timeZone;
        chargeForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const verdict = app.querySelector('#charge-verdict');
          verdict.value = 'Saving…';
          try {
            const response = await fetch('/apps/rover/add-charge', {
              method: 'POST',
              credentials: 'same-origin',
              headers: {'content-type': 'application/json'},
              body: JSON.stringify(
                Object.fromEntries(new FormData(chargeForm).entries())
              )
            });
            verdict.value = await response.text();
            if (response.ok) await loadView();
          } catch (error) {
            verdict.value = `%unavailable: charge · ${error.message}`;
          }
        });
      }

      const consumableForm = app.querySelector('#consumable-form');
      if (consumableForm) {
        if (defaultVehicle) consumableForm.elements.vehicle.value = defaultVehicle;
        consumableForm.elements.observed.value = local.toISOString().slice(0, 16);
        consumableForm.elements.zone.value =
          Intl.DateTimeFormat().resolvedOptions().timeZone;
        consumableForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const verdict = app.querySelector('#consumable-verdict');
          verdict.value = 'Saving…';
          try {
            const response = await fetch('/apps/rover/add-consumable', {
              method: 'POST',
              credentials: 'same-origin',
              headers: {'content-type': 'application/json'},
              body: JSON.stringify(
                Object.fromEntries(new FormData(consumableForm).entries())
              )
            });
            verdict.value = await response.text();
            if (response.ok) await loadView();
          } catch (error) {
            verdict.value = `%unavailable: consumable · ${error.message}`;
          }
        });
      }

      const odometerForm = app.querySelector('#odometer-form');
      if (odometerForm) {
        if (defaultVehicle) odometerForm.elements.vehicle.value = defaultVehicle;
        odometerForm.elements.observed.value = local.toISOString().slice(0, 16);
        odometerForm.elements.zone.value =
          Intl.DateTimeFormat().resolvedOptions().timeZone;
        odometerForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const verdict = app.querySelector('#odometer-verdict');
          verdict.value = 'Saving…';
          try {
            const response = await fetch('/apps/rover/add-odometer', {
              method: 'POST',
              credentials: 'same-origin',
              headers: {'content-type': 'application/json'},
              body: JSON.stringify(
                Object.fromEntries(new FormData(odometerForm).entries())
              )
            });
            verdict.value = await response.text();
            if (response.ok) await loadView();
          } catch (error) {
            verdict.value = `%unavailable: odometer · ${error.message}`;
          }
        });
      }

      app.querySelectorAll('.preference-form').forEach((preferenceForm) => {
        preferenceForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const verdict = preferenceForm.querySelector('.preference-verdict');
          verdict.value = 'Saving…';
          try {
            const response = await fetch('/apps/rover/set-preference', {
              method: 'POST',
              credentials: 'same-origin',
              headers: {'content-type': 'application/json'},
              body: JSON.stringify(
                Object.fromEntries(new FormData(preferenceForm).entries())
              )
            });
            verdict.value = await response.text();
            if (response.ok) await loadView();
          } catch (error) {
            verdict.value = `%unavailable: preference · ${error.message}`;
          }
        });
      });
    }

    async function loadView() {
      status.textContent = 'Refreshing…';
      try {
        const response = await fetch('/apps/rover/view', {
          credentials: 'same-origin',
          headers: {'accept': 'text/html'}
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        app.innerHTML = await response.text();
        bindEntryScreens();
        status.textContent = 'Connected · current on navigation';
        refreshTime.textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        status.textContent = `Unavailable · ${error.message}`;
        refreshTime.textContent = 'Connection unavailable';
      }
    }

    loadView();
  </script>
</body>
</html>
