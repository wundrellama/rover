<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0a08">
  <title>Rover · Vehicle Log</title>
  <style>
    @font-face {
      font-family: "JetBrains Mono";
      src: url("/apps/rover/assets/fonts/JetBrainsMono-Regular.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("/apps/rover/assets/fonts/JetBrainsMono-Bold.woff2") format("woff2");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --rv-bg: #0b0a08;
      --rv-bg-raised: #141210;
      --rv-amber: #d8b843;
      --rv-amber-bright: #f2d97a;
      --rv-amber-dim: #9c8922;
      --rv-olive: #4e451f;
      --rv-warn: #e07b2c;
      --rv-ok: #b8b95e;
      --rv-glow-alpha: 0.32;
      --rv-glow-blur: 0.32rem;
      color-scheme: dark;
      font-family: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
      /*  "zero" is JetBrains Mono's slashed-zero feature: it substitutes the
          dotted zero glyph for the slashed one, so 0 never reads as O in an
          odometer, a price, or a VIN.
      */
      font-feature-settings: "zero" 1;
      font-variant-numeric: slashed-zero tabular-nums;
      background: var(--rv-bg);
      color: var(--rv-amber);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background: var(--rv-bg);
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      line-height: 1.45;
    }

    button,
    input,
    select,
    textarea {
      min-height: 44px;
      border: 1px solid var(--rv-olive);
      border-radius: 0;
      background: var(--rv-bg);
      color: var(--rv-amber-bright);
      font: inherit;
    }

    button {
      padding: 0.65rem 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      border-color: var(--rv-amber-bright);
      outline: 2px solid var(--rv-amber-dim);
      outline-offset: 2px;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      min-height: 3.5rem;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--rv-olive);
      background: var(--rv-bg-raised);
    }

    .designation {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: var(--rv-amber-bright);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .wide-designation {
      display: inline;
    }

    main {
      width: min(100%, 72rem);
      margin: 0 auto;
      padding: 1rem 0.75rem 5rem;
    }

    #status {
      margin: 0 0 1rem;
      color: var(--rv-amber-dim);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .view-header {
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--rv-olive);
    }

    h1,
    h2,
    h3,
    p {
      overflow-wrap: anywhere;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      color: var(--rv-amber-bright);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 0.75rem;
      font-size: clamp(1.5rem, 8vw, 2.5rem);
    }

    h2 {
      font-size: 1.15rem;
      text-transform: none;
    }

    h3 {
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    .eyebrow,
    .key,
    dt {
      color: var(--rv-amber-dim);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .vehicle-card {
      position: relative;
      margin: 0 0 1.25rem;
      padding: 1rem;
      border-left: 1px solid var(--rv-olive);
      border-right: 1px solid var(--rv-olive);
      background: var(--rv-bg-raised);
    }

    .vehicle-card::before,
    .vehicle-card::after {
      position: absolute;
      color: var(--rv-amber-dim);
      font-size: 1.1rem;
      line-height: 1;
    }

    .vehicle-card::before {
      top: -0.15rem;
      left: -0.2rem;
      content: "⌜";
    }

    .vehicle-card::after {
      right: -0.2rem;
      bottom: -0.15rem;
      content: "⌟";
    }

    .vehicle-card > header,
    .history-card > header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .vehicle-card .eyebrow {
      margin: 0 0 0.2rem;
    }

    .status {
      flex: 0 0 auto;
      color: var(--rv-ok);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }

    .odometer {
      display: grid;
      gap: 0.2rem;
      margin: 1rem 0;
      padding: 0.8rem 0;
      border-block: 1px solid var(--rv-olive);
    }

    .odometer strong {
      color: var(--rv-amber-bright);
      font-size: 1.35rem;
      font-weight: 700;
    }

    .definitions ul {
      margin: 0.5rem 0 1rem;
      padding-left: 1.25rem;
    }

    .history-card {
      margin: 0 0 0.75rem;
      padding: 0.8rem;
      border: 1px solid var(--rv-olive);
      background: var(--rv-bg);
    }

    .history-card header {
      margin-bottom: 0.75rem;
      color: var(--rv-amber-dim);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }

    .history-card time {
      text-align: right;
    }

    dl,
    dd {
      margin: 0;
    }

    .history-card dl {
      display: grid;
      gap: 0.65rem;
    }

    .history-card dl > div {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      min-width: 0;
    }

    dd {
      color: var(--rv-amber-bright);
      text-align: right;
      overflow-wrap: anywhere;
    }

    .derived {
      padding-top: 0.55rem;
      border-top: 1px solid var(--rv-olive);
    }

    .derived dd {
      color: var(--rv-ok);
      font-weight: 700;
    }

    .empty {
      color: var(--rv-warn);
    }

    .app-screen[hidden] {
      display: none;
    }

    .hub-header {
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--rv-olive);
    }

    .hub-primary,
    .hub-readouts article {
      position: relative;
      padding: 1rem;
      border: 1px solid var(--rv-olive);
      background: var(--rv-bg-raised);
    }

    .hub-primary {
      margin-bottom: 1rem;
      border-color: var(--rv-amber);
    }

    .hub-primary p {
      margin: 0;
    }

    .hub-actions,
    .hub-readouts {
      display: grid;
      gap: 0.75rem;
    }

    #vehicle-add-form,
    .vehicle-actions,
    .vehicle-entry-actions {
      display: grid;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .vehicle-settings-form,
    .preference-form {
      display: grid;
      min-width: 0;
      gap: 0.9rem;
      margin: 1rem 0;
    }

    .vehicle-settings-form > label,
    .vehicle-settings-group > label:not(.check-option),
    .preference-form label {
      display: grid;
      min-width: 0;
      gap: 0.35rem;
      color: var(--rv-amber-dim);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .vehicle-settings-form input:not([type="checkbox"]),
    .vehicle-settings-form select,
    .preference-form select {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      padding: 0.65rem;
      letter-spacing: 0;
      text-transform: none;
    }

    .vehicle-settings-group {
      min-width: 0;
      margin: 0;
      padding: 0.8rem;
      border: 1px solid var(--rv-olive);
    }

    .vehicle-settings-group legend {
      padding: 0 0.35rem;
      color: var(--rv-amber-bright);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .vehicle-settings-group > label + label,
    .vehicle-settings-group > button + label {
      margin-top: 0.75rem;
    }

    .vehicle-settings-group > button {
      width: 100%;
      margin-top: 0.75rem;
    }

    .vehicle-settings-group .input-unit {
      grid-template-columns: minmax(0, 1fr) minmax(5.5rem, 0.35fr);
      gap: 0.5rem;
    }

    label[data-def-tank-row][hidden] {
      display: none;
    }

    .archive-vehicle-control {
      width: 100%;
      margin-bottom: 1rem;
      border-color: var(--rv-warn);
      color: var(--rv-warn);
    }

    .vehicle-settings {
      margin-bottom: 1rem;
      padding: 0.75rem;
      border: 1px solid var(--rv-olive);
    }

    .vehicle-settings summary {
      min-height: 44px;
      cursor: pointer;
      color: var(--rv-amber-bright);
      text-transform: uppercase;
    }

    .history-table-head,
    .history-record-toggle {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.5rem;
      width: 100%;
      text-align: left;
    }

    .history-table-head {
      margin-top: 1rem;
      padding: 0.5rem;
      color: var(--rv-amber-dim);
      font-size: 0.68rem;
    }

    .history-table-row {
      border: 1px solid var(--rv-olive);
    }

    .history-record-detail {
      padding: 0.8rem;
      border-top: 1px dashed var(--rv-olive);
    }

    .history-record-detail[hidden] {
      display: none;
    }

    .history-edit-form {
      display: grid;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .stat-table {
      margin-bottom: 1rem;
      padding: 0.75rem;
      border: 1px solid var(--rv-olive);
      overflow: hidden;
    }

    .stat-table h2 {
      margin-bottom: 0.75rem;
    }

    .stat-table table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 0.72rem;
    }

    .stat-table th,
    .stat-table td {
      padding: 0.45rem 0.25rem;
      border-top: 1px solid var(--rv-olive);
      overflow-wrap: anywhere;
      text-align: left;
      vertical-align: top;
    }

    .hub-actions {
      margin-bottom: 1rem;
    }

    .hub-readouts article {
      display: grid;
      gap: 0.35rem;
    }

    .hub-readouts span,
    .hub-readouts small {
      color: var(--rv-amber-dim);
    }

    .hub-readouts span {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }

    .hub-readouts strong {
      color: var(--rv-warn);
    }

    .back-control {
      width: auto;
      margin-bottom: 1rem;
      padding-inline: 0.75rem;
    }

    .action-bar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .entry-screen {
      margin-bottom: 1.25rem;
      padding: 1rem;
      border: 1px solid var(--rv-amber);
      background: var(--rv-bg-raised);
    }

    .entry-screen[hidden] {
      display: none;
    }

    .energy-source-control[hidden],
    .charge-energy-source-control[hidden],
    #fill-tags-picker[hidden],
    #fill-new-station[hidden] {
      display: none;
    }

    .entry-screen header {
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--rv-olive);
    }

    .entry-screen form,
    .entry-screen label {
      display: grid;
      gap: 0.35rem;
    }

    .entry-screen form {
      gap: 0.9rem;
    }

    .entry-screen label {
      color: var(--rv-amber-dim);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .entry-screen input,
    .entry-screen select {
      width: 100%;
      padding: 0.65rem;
      letter-spacing: 0;
      text-transform: none;
    }

    .input-unit {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
    }

    .input-unit output {
      display: grid;
      min-width: 4.5rem;
      min-height: 44px;
      place-items: center;
      border: 1px solid var(--rv-olive);
      border-left: 0;
      color: var(--rv-amber);
    }

    .preview-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: baseline;
      gap: 0.35rem 1rem;
      padding: 0.75rem;
      border: 1px solid var(--rv-olive);
      color: var(--rv-amber-dim);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .preview-row output {
      color: var(--rv-amber-bright);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .preview-row small {
      grid-column: 1 / -1;
      color: var(--rv-amber-dim);
      letter-spacing: 0;
      text-transform: none;
    }

    .derived-preview output {
      color: var(--rv-ok);
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .form-verdict {
      min-height: 1.5rem;
      color: var(--rv-warn);
    }

    /*  A run that reports a conflict or a failure keeps the warning color. Only
        a run that imported everything it was given turns green.
    */
    .form-verdict[data-import-outcome="success"] {
      color: var(--rv-ok);
    }

    #import-batch-reports {
      margin: 0;
      padding: 0.8rem;
      border: 1px solid var(--rv-olive);
    }

    #import-batch-reports legend {
      padding: 0 0.35rem;
      color: var(--rv-amber-bright);
      letter-spacing: 0.08em;
    }

    #import-batch-list {
      display: grid;
      gap: 0.5rem;
      margin: 0.5rem 0 0;
      padding-left: 1.25rem;
    }

    #import-aggregate,
    #import-batch-list li {
      color: var(--rv-amber-bright);
      font-size: 0.72rem;
      letter-spacing: 0;
      text-transform: none;
      white-space: pre-wrap;
    }

    .theme-glow-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .theme-glow-control label {
      display: grid;
      gap: 0.35rem;
      min-width: 0;
    }

    .theme-glow-control input {
      width: 100%;
    }

    .theme-glow-control input:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }

    .theme-glow-control output {
      display: grid;
      min-width: 3.5rem;
      min-height: 44px;
      place-items: center;
      border: 1px solid var(--rv-olive);
      color: var(--rv-amber-bright);
    }

    .station-field,
    #fill-additives,
    #fill-tags,
    #fill-custom-fields,
    .drive-balance {
      margin: 0;
      padding: 0.8rem;
      border: 1px solid var(--rv-olive);
    }

    .station-field legend,
    #fill-additives legend,
    #fill-tags legend,
    #fill-custom-fields legend,
    .drive-balance legend {
      padding: 0 0.35rem;
      color: var(--rv-amber-bright);
      letter-spacing: 0.08em;
    }

    #fill-new-station {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--rv-olive);
    }

    .check-grid {
      display: grid;
      gap: 0.5rem;
    }

    .check-option {
      display: flex;
      min-height: 44px;
      flex-direction: row;
      align-items: center;
      gap: 0.65rem;
      margin: 0;
      color: var(--rv-text);
      letter-spacing: 0;
      text-transform: none;
    }

    .check-option input {
      width: 1.2rem;
      min-height: 1.2rem;
      margin: 0;
      accent-color: var(--rv-amber);
    }

    .read-only-row,
    .drive-balance {
      display: grid;
      gap: 0.5rem;
    }

    .read-only-row {
      padding: 0.65rem 0;
      color: var(--rv-amber-dim);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .read-only-row output,
    .drive-balance output {
      color: var(--rv-amber-bright);
      letter-spacing: 0;
      text-transform: none;
    }

    .drive-balance input[data-state="unset"] {
      opacity: 0.35;
    }

    .balance-ends {
      display: flex;
      justify-content: space-between;
      color: var(--rv-amber-dim);
      font-size: 0.72rem;
      text-transform: uppercase;
    }

    #fill-tags-picker {
      margin-top: 0.75rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .chip {
      padding: 0.15rem 0.4rem;
      border: 1px solid var(--rv-olive);
      color: var(--rv-amber-bright);
      font-size: 0.72rem;
    }

    .status-strip {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.45rem 0.75rem;
      border-top: 1px solid var(--rv-olive);
      background: var(--rv-bg-raised);
      color: var(--rv-amber-dim);
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .glow body {
      text-shadow: 0 0 var(--rv-glow-blur) rgba(216, 184, 67, var(--rv-glow-alpha));
    }

    @media (min-width: 48rem) {
      main {
        padding-inline: 1.5rem;
      }

      .action-bar {
        grid-template-columns: repeat(3, 1fr);
      }

      .entry-screen form {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .entry-screen .preview-row,
      .entry-screen .form-actions,
      .entry-screen .form-verdict {
        grid-column: 1 / -1;
      }

      #vehicle-view {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }

      .view-header {
        grid-column: 1 / -1;
      }

      .vehicle-card {
        margin: 0;
      }

      .history-card dl {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <header class="terminal-header">
    <p id="rover-designation" class="designation">
      ROVER · VEHICLE LOG<span class="wide-designation"> · <span id="header-ship">SHIP UNAVAILABLE</span> · <span id="header-vehicle">NO DEFAULT VEHICLE</span></span>
    </p>
    <button id="glow-toggle" type="button" aria-pressed="false">Glow off</button>
  </header>
  <main>
    <p id="status">Loading…</p>
    <div id="app" aria-live="polite"></div>
  </main>
  <footer class="status-strip">
    <span>Rover</span>
    <span id="refresh-time">Awaiting data</span>
  </footer>
  <script>
    const app = document.getElementById('app');
    const status = document.getElementById('status');
    const refreshTime = document.getElementById('refresh-time');
    const glowToggle = document.getElementById('glow-toggle');
    const headerShip = document.getElementById('header-ship');
    const headerVehicle = document.getElementById('header-vehicle');

    let glow = false;
    //  32 renders alpha 0.32 under the percentage scale: the same default the
    //  theme has always shipped, now stated honestly by its own control.
    let glowIntensity = 32;
    try {
      glow = localStorage.getItem('rover-glow') === 'on';
      const storedGlowIntensity =
        localStorage.getItem('rover-glow-intensity');
      const storedIntensity = Number(storedGlowIntensity);
      if (
        storedGlowIntensity !== null &&
        Number.isInteger(storedIntensity) &&
        storedIntensity >= 0 &&
        storedIntensity <= 100
      ) {
        glowIntensity = storedIntensity;
      }
    } catch (_) {
      glow = false;
      glowIntensity = 32;
    }

    function showGlow() {
      //  The slider reads as a percentage, so it means one: intensity N gives
      //  alpha N/100. A control that says 45% and renders alpha 0.72 is lying
      //  about the setting it holds. The legacy 0.32 look is preserved exactly,
      //  at its honest index of 32.
      const alpha = glowIntensity / 100;
      const blur = glowIntensity / 100;
      document.documentElement.style.setProperty(
        '--rv-glow-intensity',
        String(glowIntensity)
      );
      document.documentElement.style.setProperty(
        '--rv-glow-alpha',
        alpha.toFixed(3)
      );
      document.documentElement.style.setProperty(
        '--rv-glow-blur',
        `${blur.toFixed(3)}rem`
      );
      document.documentElement.classList.toggle('glow', glow);
      glowToggle.setAttribute('aria-pressed', String(glow));
      glowToggle.textContent = glow ? 'Glow on' : 'Glow off';
      app.querySelectorAll('[data-glow-intensity]').forEach((slider) => {
        slider.value = String(glowIntensity);
        slider.disabled = !glow;
      });
      app.querySelectorAll('[data-glow-intensity-output]').forEach((output) => {
        output.value = `${glowIntensity}%`;
        output.textContent = `${glowIntensity}%`;
      });
    }

    glowToggle.addEventListener('click', () => {
      glow = !glow;
      showGlow();
      try {
        localStorage.setItem('rover-glow', glow ? 'on' : 'off');
      } catch (_) {
        // The toggle still works when storage is unavailable.
      }
    });
    showGlow();

    function syncHeader() {
      const context = app.querySelector('#rover-header-data');
      headerShip.textContent = context?.dataset.ship || 'SHIP UNAVAILABLE';
      headerVehicle.textContent =
        context?.dataset.vehicle || 'NO DEFAULT VEHICLE';
    }

    function parseScaled(text, places) {
      const cleaned = text.trim().replaceAll(',', '');
      const match = cleaned.match(/^([0-9]+)(?:\.([0-9]*))?$/);
      if (!match || (match[2] || '').length > places) return null;
      const fraction = (match[2] || '').padEnd(places, '0');
      return BigInt(match[1] + fraction);
    }

    function completedPrice(text, profile) {
      const cleaned = text.trim().replace(/^\$\s*/, '');
      if (profile === 'us-usd-gal') {
        const match = cleaned.match(/^([0-9]+)(?:\.([0-9]*))?$/);
        if (!match || (match[2] || '').length > 3) return null;
        const fraction = match[2] || '';
        if (fraction.length === 3) return BigInt(match[1] + fraction);
        const cents = BigInt(match[1] + fraction.padEnd(2, '0'));
        return cents * 10n + 9n;
      }
      return parseScaled(cleaned, 3);
    }

    function millsText(mills, currency, decimals) {
      const minorScale = 10n ** BigInt(decimals);
      const millsPerMinor = 1000n / minorScale;
      const minor = mills / millsPerMinor;
      const whole = minor / minorScale;
      const fraction = (minor % minorScale).toString().padStart(decimals, '0');
      const prefix = currency === 'usd' ? '$' : 'EUR ';
      return `${prefix}${whole}${decimals ? `.${fraction}` : ''}`;
    }

    function priceText(mills, profile) {
      const whole = mills / 1000n;
      const fraction = (mills % 1000n).toString().padStart(3, '0');
      return `${profile === 'us-usd-gal' ? '$' : 'EUR '}${whole}.${fraction}`;
    }

    function roundHalfUp(numerator, denominator) {
      return (numerator + denominator / 2n) / denominator;
    }

    //  The import report shape is fixed. tools/rover-import/upload.py reads it
    //  with the same seven patterns, so the browser and the CLI report the same
    //  numbers for the same run.
    const IMPORT_REPORT_PATTERNS = [
      [
        'fills',
        'Fills',
        /Fills: imported (\d+), already-imported (\d+), conflicts (\d+), failures (\d+)/
      ],
      ['definitions', 'Definitions', /Definitions: created (\d+), reused (\d+)/],
      ['places', 'Places', /Places: created (\d+), reused (\d+)/],
      ['vehicles', 'Vehicles', /Vehicles: created (\d+), reused (\d+)/],
      ['stationNone', 'Station-none fills', /Station-none fills: (\d+)/],
      [
        'totals',
        'Total cross-check',
        /Total cross-check: exact (\d+), off-by-one (\d+), beyond (\d+)/
      ],
      ['unitMismatches', 'Unit mismatches', /Unit mismatches: (\d+)/]
    ];

    //  Decimals stay strings end to end. A floating-point token would go through
    //  a double on the way back out and could rewrite the owner's own numbers,
    //  so it is refused here exactly as upload.py refuses it with parse_float.
    //  An integer that does not survive the round trip is refused for the same
    //  reason.
    function importNumberRefusal(text) {
      let inString = false;
      let escaped = false;
      let index = 0;
      while (index < text.length) {
        const character = text[index];
        if (inString) {
          if (escaped) escaped = false;
          else if (character === '\\') escaped = true;
          else if (character === '"') inString = false;
          index += 1;
        } else if (character === '"') {
          inString = true;
          index += 1;
        } else if (character === '-' || (character >= '0' && character <= '9')) {
          let end = index;
          while (end < text.length && /[-+.0-9eE]/.test(text[end])) end += 1;
          const token = text.slice(index, end);
          if (/[.eE]/.test(token)) {
            return `%bad-shape: import.number · floating-point token ${token} is forbidden`;
          }
          if (String(Number(token)) !== token) {
            return `%bad-shape: import.number · ${token} does not survive a JSON round trip`;
          }
          index = end;
        } else {
          index += 1;
        }
      }
      return null;
    }

    function importFillCount(source) {
      return source.vehicles.reduce(
        (total, vehicle) => total + vehicle.fills.length,
        0
      );
    }

    //  A port of +batch_documents in tools/rover-import/upload.py. Flatten the
    //  (vehicle index, fill) pairs across every vehicle, copy the whole document
    //  per batch including its definitions preamble, empty every vehicle, and
    //  refill one slice. Each batch is a complete document on its own.
    function importBatchDocuments(source, batchSize) {
      const flattened = [];
      source.vehicles.forEach((vehicle, vehicleIndex) => {
        vehicle.fills.forEach((fill) => flattened.push([vehicleIndex, fill]));
      });
      const starts = [];
      for (let start = 0; start < flattened.length; start += batchSize) {
        starts.push(start);
      }
      if (!starts.length) starts.push(0);
      return starts.map((start) => {
        const batch = structuredClone(source);
        batch.vehicles.forEach((vehicle) => {
          vehicle.fills = [];
        });
        flattened
          .slice(start, start + batchSize)
          .forEach(([vehicleIndex, fill]) => {
            batch.vehicles[vehicleIndex].fills.push(structuredClone(fill));
          });
        return batch;
      });
    }

    //  Reads a document and plans its batches. Nothing reaches the endpoint
    //  until this returns ok. The desk validates every record again with
    //  +decode-import; this refuses only the document shapes that would make the
    //  batch split meaningless.
    function importPrepare(text, batchSizeText) {
      const size = String(batchSizeText).trim();
      if (!/^[0-9]+$/.test(size) || Number(size) === 0) {
        return {ok: false, verdict: '%bad-shape: import.batch-size'};
      }
      const numberRefusal = importNumberRefusal(text);
      if (numberRefusal) return {ok: false, verdict: numberRefusal};
      let source;
      try {
        source = JSON.parse(text);
      } catch (error) {
        return {ok: false, verdict: `%bad-shape: import · ${error.message}`};
      }
      if (
        source === null ||
        typeof source !== 'object' ||
        Array.isArray(source) ||
        source['rover-import'] !== 1
      ) {
        return {ok: false, verdict: '%bad-shape: import.rover-import'};
      }
      if (!('vehicles' in source)) {
        return {ok: false, verdict: '%missing-key: import.vehicles'};
      }
      if (!Array.isArray(source.vehicles)) {
        return {ok: false, verdict: '%bad-shape: import.vehicles'};
      }
      const without = source.vehicles.findIndex(
        (vehicle) =>
          vehicle === null ||
          typeof vehicle !== 'object' ||
          Array.isArray(vehicle) ||
          !Array.isArray(vehicle.fills)
      );
      if (without >= 0) {
        return {
          ok: false,
          verdict: `%bad-shape: import.vehicle.fills · vehicle ${without}`
        };
      }
      const batches = importBatchDocuments(source, Number(size));
      const fills = importFillCount(source);
      const batched = batches.reduce(
        (total, batch) => total + importFillCount(batch),
        0
      );
      //  upload.py makes the same assertion. A split that loses or duplicates a
      //  fill is a defect in the split, and no batch of it may be sent.
      if (fills !== batched) {
        return {
          ok: false,
          verdict: `%unavailable: import · batching changed the fill count from ${fills} to ${batched}`
        };
      }
      return {ok: true, verdict: '', fills, batches};
    }

    function importParseReport(text) {
      const parsed = {};
      IMPORT_REPORT_PATTERNS.forEach(([name, label, pattern]) => {
        const match = pattern.exec(text);
        if (!match) throw new Error(`import response omitted ${label}`);
        const values = match.slice(1).map(Number);
        parsed[name] = values.length > 1 ? values : values[0];
      });
      return parsed;
    }

    function importAggregateReports(reports) {
      const aggregate = {
        fills: [0, 0, 0, 0],
        definitions: [0, 0],
        places: [0, 0],
        vehicles: [0, 0],
        stationNone: 0,
        totals: [0, 0, 0],
        unitMismatches: 0
      };
      reports.forEach((report) => {
        const parsed = importParseReport(report);
        ['fills', 'definitions', 'places', 'vehicles', 'totals'].forEach(
          (name) => {
            aggregate[name] = aggregate[name].map(
              (value, index) => value + parsed[name][index]
            );
          }
        );
        aggregate.stationNone += parsed.stationNone;
        aggregate.unitMismatches += parsed.unitMismatches;
      });
      return aggregate;
    }

    function importRenderAggregate(aggregate) {
      const [imported, already, conflicts, failures] = aggregate.fills;
      const [definitionsCreated, definitionsReused] = aggregate.definitions;
      const [placesCreated, placesReused] = aggregate.places;
      const [vehiclesCreated, vehiclesReused] = aggregate.vehicles;
      const [exact, offByOne, beyond] = aggregate.totals;
      return [
        `Fills: imported ${imported}, already-imported ${already}, conflicts ${conflicts}, failures ${failures}`,
        `Definitions: created ${definitionsCreated}, reused ${definitionsReused}`,
        `Places: created ${placesCreated}, reused ${placesReused}`,
        `Vehicles: created ${vehiclesCreated}, reused ${vehiclesReused}`,
        `Station-none fills: ${aggregate.stationNone}`,
        `Total cross-check: exact ${exact}, off-by-one ${offByOne}, beyond ${beyond}`,
        `Unit mismatches: ${aggregate.unitMismatches}`
      ].join('\n');
    }

    function bindEntryScreens() {
      app.querySelectorAll('[data-glow-intensity]').forEach((slider) => {
        slider.value = String(glowIntensity);
        slider.addEventListener('input', () => {
          glowIntensity = Number(slider.value);
          showGlow();
          try {
            localStorage.setItem(
              'rover-glow-intensity',
              String(glowIntensity)
            );
          } catch (_) {
            // The live preference still works when storage is unavailable.
          }
        });
      });
      showGlow();
      const screens = [...app.querySelectorAll('.app-screen')];
      const defaultVehicle =
        app.querySelector('#app-default-data')?.dataset.vehicle || '';
      app.querySelectorAll('[data-open-screen]').forEach((button) => {
        button.addEventListener('click', () => {
          screens.forEach((screen) => {
            screen.hidden = screen.id !== button.dataset.openScreen;
          });
          document.getElementById(button.dataset.openScreen)?.scrollIntoView();
        });
      });
      app.querySelectorAll('[data-view-page]').forEach((button) => {
        button.addEventListener('click', async () => {
          await loadView(Number(button.dataset.viewPage), button.dataset.viewTarget || '');
        });
      });
      app.querySelectorAll('[data-close-screen]').forEach((button) => {
        button.addEventListener('click', () => {
          screens.forEach((screen) => {
            screen.hidden = screen.id !== 'main-hub';
          });
          document.getElementById('main-hub')?.scrollIntoView();
        });
      });
      const importForm = app.querySelector('#import-form');
      if (importForm) {
        const importFile = app.querySelector('#import-file');
        const importBatchSize = app.querySelector('#import-batch-size');
        const importValidateControl = app.querySelector('#import-validate');
        const importPlan = app.querySelector('#import-plan');
        const importProgress = app.querySelector('#import-progress');
        const importOutcome = app.querySelector('#import-outcome');
        const importBatchList = app.querySelector('#import-batch-list');
        const importAggregate = app.querySelector('#import-aggregate');
        const importRefresh = app.querySelector('#import-refresh');
        let importRunning = false;

        const settleImport = (outcome, message) => {
          importOutcome.dataset.importOutcome = outcome;
          importOutcome.value = message;
        };

        const readImport = async () => {
          const file = importFile.files[0];
          if (!file) {
            settleImport('refused', '%missing-key: import.document');
            return null;
          }
          const prepared = importPrepare(await file.text(), importBatchSize.value);
          if (!prepared.ok) {
            importPlan.value = '—';
            settleImport('refused', prepared.verdict);
            return null;
          }
          importPlan.value =
            `${prepared.fills} fills in ${prepared.batches.length} batches`;
          return prepared;
        };

        importValidateControl.addEventListener('click', async () => {
          if (importRunning) return;
          settleImport('', '');
          const prepared = await readImport();
          if (prepared) {
            settleImport(
              'validated',
              `${prepared.fills} fills are ready. Rover sent nothing.`
            );
          }
        });

        importRefresh.addEventListener('click', async () => {
          await loadView(0, 'import-screen');
        });

        importForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (importRunning) return;
          settleImport('', '');
          importBatchList.replaceChildren();
          importAggregate.value = '—';
          importProgress.value = '—';
          importRefresh.hidden = true;
          //  Client-side validation runs again here, so no unchecked document
          //  reaches the endpoint even when the operator skips Validate.
          const prepared = await readImport();
          if (!prepared) return;
          importRunning = true;
          const total = prepared.batches.length;
          const reports = [];
          let settled = null;
          for (let index = 0; index < total; index += 1) {
            importProgress.value = `Batch ${index + 1} of ${total} - sending`;
            let response;
            let body;
            try {
              //  One batch at a time, never concurrent. The endpoint holds one
              //  run and answers 409 to a second.
              response = await fetch('/apps/rover/import', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {'content-type': 'application/json'},
                body: JSON.stringify(prepared.batches[index])
              });
              body = await response.text();
            } catch (error) {
              settled = [
                'stopped',
                `Import stopped at batch ${index + 1} of ${total} - %unavailable: import · ${error.message}`
              ];
              break;
            }
            //  409 means another client holds the run. Say so and stop. A retry
            //  loop here would hammer a busy endpoint and hide the state.
            if (response.status === 409) {
              settled = [
                'blocked',
                `An import is already running. Rover stopped at batch ${index + 1} of ${total} and sent nothing more.`
              ];
              break;
            }
            if (!response.ok) {
              settled = [
                'stopped',
                `Import stopped at batch ${index + 1} of ${total} - HTTP ${response.status} ${body.trim()}`
              ];
              break;
            }
            try {
              importParseReport(body);
            } catch (error) {
              settled = [
                'stopped',
                `Import stopped at batch ${index + 1} of ${total} - %unavailable: import · ${error.message}`
              ];
              break;
            }
            reports.push(body);
            const item = document.createElement('li');
            item.dataset.importBatch = String(index + 1);
            item.textContent = body.trim();
            importBatchList.append(item);
            const running = importAggregateReports(reports);
            importProgress.value =
              `Batch ${index + 1} of ${total} - imported ${running.fills[0]}, already-imported ${running.fills[1]}, conflicts ${running.fills[2]}, failures ${running.fills[3]}`;
          }
          importRunning = false;
          importRefresh.hidden = false;
          if (reports.length) {
            const aggregate = importAggregateReports(reports);
            importAggregate.value = importRenderAggregate(aggregate);
            if (!settled) {
              const [imported, already, conflicts, failures] = aggregate.fills;
              if (conflicts || failures) {
                settled = [
                  'incomplete',
                  `Import finished - conflicts ${conflicts}, failures ${failures}. Read the batch reports.`
                ];
              } else {
                settled = [
                  'success',
                  `Import complete - imported ${imported}, already-imported ${already}.`
                ];
              }
            }
          }
          if (settled) settleImport(settled[0], settled[1]);
        });
      }

      app.querySelectorAll('[data-open-vehicle-settings]').forEach((button) => {
        button.addEventListener('click', () => {
          screens.forEach((screen) => {
            screen.hidden = screen.id !== 'vehicle-settings-screen';
          });
          app.querySelectorAll('[data-vehicle-settings-panel]').forEach((panel) => {
            panel.hidden = panel.dataset.vehicle !== button.dataset.vehicle;
          });
          document.getElementById('vehicle-settings-screen')?.scrollIntoView();
        });
      });

      const vehicleAddForm = app.querySelector('#vehicle-add-form');
      if (vehicleAddForm) {
        const energy = vehicleAddForm.elements.energy;
        const seen = new Set();
        [...energy.options].forEach((option) => {
          if (seen.has(option.value)) option.remove();
          else seen.add(option.value);
        });
        const defConfiguration = vehicleAddForm.querySelector('[data-def-configuration]');
        const updateDefAffordance = () => {
          if (!defConfiguration) return;
          const additional = [...vehicleAddForm.elements.additionalEnergy.selectedOptions]
            .map((option) => option.value);
          defConfiguration.hidden = ![energy.value, ...additional].includes('Diesel');
        };
        energy.addEventListener('change', updateDefAffordance);
        vehicleAddForm.elements.additionalEnergy.addEventListener('change', updateDefAffordance);
        updateDefAffordance();
        vehicleAddForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const verdict = vehicleAddForm.querySelector('output');
          verdict.value = 'Saving…';
          const formData = new FormData(vehicleAddForm);
          const payload = Object.fromEntries(formData);
          payload.additionalEnergy = formData.getAll('additionalEnergy');
          payload.drivingModes = formData.getAll('drivingModes');
          payload.defEnabled = formData.has('defEnabled') ? 'yes' : 'no';
          const response = await fetch('/apps/rover/add-vehicle', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify(payload)
          });
          verdict.value = await response.text();
          if (response.ok) await loadView();
        });
      }

      app.querySelectorAll('[data-set-default-vehicle]').forEach((button) => {
        button.addEventListener('click', async () => {
          const response = await fetch('/apps/rover/set-default-vehicle', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({vehicle: button.dataset.vehicle})
          });
          if (response.ok) await loadView();
        });
      });

      app.querySelectorAll('[data-remove-vehicle]').forEach((button) => {
        button.addEventListener('click', async () => {
          if (!confirm(`Archive ${button.dataset.vehicle}? Its history will remain available.`)) return;
          const response = await fetch('/apps/rover/remove-vehicle', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({vehicle: button.dataset.vehicle})
          });
          if (response.ok) await loadView();
          else alert(await response.text());
        });
      });
      app.querySelectorAll('.vehicle-settings-form').forEach((settingsForm) => {
        const defaultEnergy = settingsForm.elements.defaultEnergy;
        const syncDefaultEnergy = () => {
          if (!defaultEnergy) return;
          const allowed = new Set(
            [...settingsForm.querySelectorAll('[name="energySources"]:checked')]
              .map((input) => input.value)
          );
          [...defaultEnergy.options].forEach((option) => {
            if (!option.value) return;
            option.hidden = !allowed.has(option.value);
          });
          if (defaultEnergy.selectedOptions[0]?.hidden) defaultEnergy.value = '';
        };
        settingsForm.querySelectorAll('[name="energySources"]').forEach((input) => {
          input.addEventListener('change', syncDefaultEnergy);
        });
        syncDefaultEnergy();
        const defToggle = settingsForm.elements.defEnabled;
        const defTankRow = settingsForm.querySelector('[data-def-tank-row]');
        const syncDefConfiguration = () => {
          if (!defToggle || !defTankRow) return;
          defTankRow.hidden = !defToggle.checked;
          defTankRow.querySelectorAll('input, select').forEach((control) => {
            control.disabled = !defToggle.checked;
          });
        };
        defToggle?.addEventListener('change', syncDefConfiguration);
        syncDefConfiguration();
        settingsForm.querySelector('[data-add-energy-source]')?.addEventListener('click', async () => {
          const label = prompt('Energy source label');
          if (!label?.trim()) return;
          const physicalKind =
            confirm('Is this an electricity source? Choose Cancel for a reservoir fuel.')
              ? 'electricity'
              : 'reservoir';
          const quantityUnit = prompt(
            'Quantity unit: gal, litre, kg, or kwh',
            physicalKind === 'electricity' ? 'kwh' : 'gal'
          );
          if (!quantityUnit?.trim()) return;
          const response = await fetch('/apps/rover/add-energy-source-type', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({label: label.trim(), physicalKind, quantityUnit: quantityUnit.trim()})
          });
          settingsForm.querySelector('output').value = await response.text();
          if (response.ok) await loadView();
        });
        settingsForm.querySelector('[data-add-driving-mode]')?.addEventListener('click', async () => {
          const label = prompt('Driving mode label');
          if (!label?.trim()) return;
          const response = await fetch('/apps/rover/add-driving-mode-type', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({label: label.trim()})
          });
          settingsForm.querySelector('output').value = await response.text();
          if (response.ok) await loadView();
        });
        settingsForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const verdict = settingsForm.querySelector('output');
          verdict.value = 'Saving…';
          const formData = new FormData(settingsForm);
          const payload = Object.fromEntries(formData);
          payload.energySources = formData.getAll('energySources');
          payload.drivingModes = formData.getAll('drivingModes');
          payload.defEnabled = formData.has('defEnabled') ? 'yes' : 'no';
          const response = await fetch('/apps/rover/edit-vehicle', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify(payload)
          });
          verdict.value = await response.text();
          if (response.ok) await loadView();
        });
      });

      app.querySelectorAll('[data-vehicle-action]').forEach((button) => {
        button.addEventListener('click', () => {
          const screenId = {
            fill: 'add-fill',

          }[button.dataset.vehicleAction];
          screens.forEach((screen) => {
            screen.hidden = screen.id !== screenId;
          });

        editForm.addEventListener('submit', async (event) => {
          event.preventDefault();

        const selectedUnavailable =
          subtype.selectedOptions[0]?.dataset.definition &&
          subtype.selectedOptions[0]?.hidden;

          const preferredOption = options.find(

      const syncDrivingModes = () => {
        const options = [...drivingMode.options];

      const syncPreviousOdometer = () => {

        const prior = [...app.querySelectorAll('[data-odometer-observation]')]
          .filter((marker) =>
            marker.dataset.vehicle === vehicle.value &&
            marker.dataset.observed < observed

          .sort((left, right) =>
            right.dataset.observed.localeCompare(left.dataset.observed)
          )[0];

      const updatePreview = () => {

        if (quantityMilli === null || priceMills === null) {

        const product = quantityMilli * priceMills;
        const minor = roundHalfUp(product * 100n, 1000000n);

          chargeForm.querySelector('#charge-component-template');
        const itemizedTotal = chargeForm.querySelector('#charge-itemized-total');
        // Exact thousandths. A decimal entry never becomes a float here.
        const toMills = (text) => {
          const trimmed = String(text ?? '').replace(/,/g, '').trim();
          if (!/^[0-9]+(\.[0-9]{0,3})?$/.test(trimmed)) return null;
          const [whole, fraction = ''] = trimmed.split('.');
          return Number(whole + fraction.padEnd(3, '0'));

        const readComponents = () =>
          [...componentRows.querySelectorAll('[data-cost-component-row]')]

              component: row.querySelector('[name="componentKind"]').value,

              rate: row.querySelector('[name="componentRate"]').value.trim(),

          let charges = 0;
          let discounts = 0;

          readComponents().forEach((row) => {
            const mills = toMills(row.amount);
            if (mills === null) {
              exact = false;
              return;
            }
            if (row.component === 'discount') discounts += mills;
            else charges += mills;
          });
          if (!exact || charges < discounts) {
            itemizedTotal.value = '—';
            return;
          }
          const total = charges - discounts;
          itemizedTotal.value =
            `$${Math.floor(total / 1000)}.${String(total % 1000).padStart(3, '0')}`;
        };
        const syncCostState = () => {
          chargeItemized.hidden = chargeCostState.value !== 'itemized';
          chargeReceipt.hidden = chargeCostState.value !== 'receipt-total-only';

      const eventForm = app.querySelector('#event-form');

        // A subtype belongs on a service visit and not on a note. That is a UI

        if (eventSubtypes) {

        eventForm.addEventListener('submit', async (event) => {
          event.preventDefault();

          verdict.value = 'Saving…';

            const response = await fetch(`/apps/rover/add-${eventKind}-event`, {
              method: 'POST',

              headers: {'content-type': 'application/json'},

            verdict.value = await response.text();
            if (response.ok) await loadView();

      // A reminder carries an interval in time, an interval in distance, or

      const reminderForm = app.querySelector('#reminder-form');

    let viewLoaded = false;

    async function loadView(page = 0, target = '', vehicle = '') {
      status.textContent = viewLoaded ? 'Refreshing…' : 'Loading…';
      try {
        const selectedVehicle = vehicle || (
          target === 'history-screen'
            ? app.querySelector('#history-vehicle-filter')?.value || ''
            : target === 'statistics-screen'
              ? app.querySelector('#statistics-vehicle-select')?.value || ''
              : ''
        );
        const scopedRequest = selectedVehicle.length > 0;
        const response = await fetch('/apps/rover/view', {
          method: page === 0 && !scopedRequest ? 'GET' : 'POST',
          body: page === 0 && !scopedRequest
            ? undefined
            : scopedRequest
              ? JSON.stringify({page: String(page), vehicle: selectedVehicle})
              : String(page),
          credentials: 'same-origin',
          headers: {'accept': 'text/html', 'content-type': scopedRequest ? 'application/json' : 'text/plain'}
        });
        if (response.headers.get('x-rover-bootstrap') === 'performed') {
          status.textContent = 'Setting up the database…';
        }
        const responseBody = await response.text();
        if (!response.ok) {
          app.textContent = responseBody;
          status.textContent = 'Unavailable · Rover could not load the vehicle log';
          refreshTime.textContent = 'The database request failed';
          return;
        }
        app.innerHTML = responseBody;
        viewLoaded = true;
        syncHeader();
        bindEntryScreens();
        if (target) {
          app.querySelectorAll('.app-screen').forEach((screen) => {
            screen.hidden = screen.id !== target;
          });
          document.getElementById(target)?.scrollIntoView();
        }
        status.textContent = 'Connected · current on navigation';
        refreshTime.textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        status.textContent = `Unavailable · ${error.message}`;
        refreshTime.textContent = 'Connection unavailable';
      }
    }
